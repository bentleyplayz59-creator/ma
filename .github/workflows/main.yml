name: Build Stardew Valley Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x' # Adjust to '8.0.x' or your project's target framework if needed

    - name: Restore dependencies
      run: dotnet restore RobotHelper/RobotHelper.csproj

    - name: Build project
      run: dotnet build RobotHelper/RobotHelper.csproj --configuration Release --no-restore

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RobotHelper-Release
        path: |
          RobotHelper/bin/Release/**
